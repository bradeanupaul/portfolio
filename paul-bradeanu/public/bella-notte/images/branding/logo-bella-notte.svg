  <text x="840" y="420" text-anchor="middle" font-family="Didot, 'Bodoni 72', Georgia, serif" font-size="176" font-weight="400" fill="#F6EFE4" letter-spacing="6">Bella Notte</text>
  <text x="840" y="500" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="500" fill="#F8F5EE" letter-spacing="20">RISTORANTE ITALIANO</text>
  <!-- Thin long Italian flag -->
  <g transform="translate(720 540)">
