    <path d="M0 28 C18 10 48 -8 78 -18" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 28 C-6 55 -3 95 0 128" fill="none" stroke="url(#gold)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Left leaves -->
    <ellipse cx="-42" cy="-6" rx="22" ry="11" transform="rotate(-38 -42 -6)" fill="url(#gold)"/>
    <ellipse cx="-72" cy="8" rx="20" ry="10" transform="rotate(-22 -72 8)" fill="#D8AF5B"/>
    <ellipse cx="-28" cy="22" rx="18" ry="9" transform="rotate(-52 -28 22)" fill="#C9A04E"/>
    <ellipse cx="-58" cy="28" rx="16" ry="8" transform="rotate(-30 -58 28)" fill="#D8AF5B" opacity="0.9"/>
    <!-- Right leaves -->
    <ellipse cx="42" cy="-6" rx="22" ry="11" transform="rotate(38 42 -6)" fill="url(#gold)"/>
    <ellipse cx="72" cy="8" rx="20" ry="10" transform="rotate(22 72 8)" fill="#D8AF5B"/>
    <ellipse cx="28" cy="22" rx="18" ry="9" transform="rotate(52 28 22)" fill="#C9A04E"/>
    <ellipse cx="58" cy="28" rx="16" ry="8" transform="rotate(30 58 28)" fill="#D8AF5B" opacity="0.9"/>
    <!-- Center bud -->
