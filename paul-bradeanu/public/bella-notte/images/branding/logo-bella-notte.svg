<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="195" viewBox="0 0 1680 780">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C878"/>
      <stop offset="55%" stop-color="#D8AF5B"/>
      <stop offset="100%" stop-color="#B8923F"/>
